<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Forgot password · Setlarr</title>
<meta name="viewport" content="width=1280" />
<link rel="stylesheet" href="./styles/colors_and_type.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--neutral-50); color: var(--neutral-900); min-width: 1280px; }
  button, input { font-family: inherit; }
  button { cursor: pointer; }
  [data-lucide] { display: inline-block; vertical-align: middle; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: #fff; border-bottom: 1px solid var(--neutral-200); z-index: 50; }
  .topbar-inner { height: 100%; max-width: 1280px; margin: 0 auto; padding: 0 80px; display: flex; align-items: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; }
  .logo-mark { width: 28px; height: 28px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; }
  .logo-mark > span { background: var(--brand-600); border-radius: 3px; }
  .logo-mark > span:nth-child(2) { background: var(--brand-500); }
  .logo-mark > span:nth-child(3) { background: var(--brand-500); }
  .logo-mark > span:nth-child(4) { background: var(--brand-700); }
  .logo-word { font-size: 18px; font-weight: 600; color: var(--neutral-900); letter-spacing: -0.2px; }

  main { padding: 96px 40px 64px; min-height: 100vh; box-sizing: border-box; }

  .frame {
    max-width: 1640px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    align-items: flex-start;
    position: relative;
    isolation: isolate;
  }
  .frame::before {
    content: '';
    position: fixed;
    top: 64px; right: 0;
    width: 600px; height: 600px;
    background-image: radial-gradient(circle, hsl(248, 30%, 84%) 1px, transparent 1.2px);
    background-size: 24px 24px;
    mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
    z-index: -1;
    opacity: 0.4;
    pointer-events: none;
  }
  .step-col { display: flex; flex-direction: column; align-items: center; }
  .step-label {
    margin-bottom: 16px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600;
    color: var(--brand-700);
    letter-spacing: 0.06em; text-transform: uppercase;
    background: #fff;
    padding: 6px 12px 6px 8px;
    border-radius: 9999px;
    box-shadow: var(--elevation-1);
  }
  .step-label .num {
    width: 18px; height: 18px;
    border-radius: 9999px;
    background: var(--brand-100); color: var(--brand-700);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px;
  }

  .card {
    width: 100%; max-width: 480px;
    background: #fff;
    border-radius: 16px;
    padding: 48px;
    box-sizing: border-box;
    box-shadow: 0 2px 8px rgba(30,20,60,0.08), 0 4px 16px rgba(30,20,60,0.06);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute; top: -3px; left: 50%;
    transform: translateX(-50%);
    width: 56px; height: 5px;
    border-radius: 9999px;
    background: linear-gradient(90deg, var(--brand-500), var(--warning-500), var(--success-500));
  }
  .icon-block {
    width: 56px; height: 56px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .icon-block.brand   { background: var(--brand-50); color: var(--brand-600); }
  .icon-block.success { background: var(--success-50); color: var(--success-600); }
  .icon-block.neutral { background: var(--neutral-100); color: var(--neutral-700); }

  .card h1 {
    margin: 0;
    font-size: 24px; font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--neutral-900);
    text-align: center;
  }
  .card .sub {
    margin: 12px 0 0 0;
    font-size: 14px; font-weight: 400;
    color: var(--neutral-500);
    text-align: center;
    line-height: 1.6;
  }
  .card .sub strong { color: var(--neutral-900); font-weight: 600; }

  form { margin-top: 32px; display: flex; flex-direction: column; gap: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 13px; font-weight: 600; color: var(--neutral-900); }
  .input {
    display: flex; align-items: center;
    height: 46px;
    background: transparent;
    border: 1px solid var(--neutral-300);
    border-radius: 8px;
    padding: 0 14px;
    gap: 8px;
    transition: border-color var(--dur-micro) var(--ease-out),
                box-shadow var(--dur-micro) var(--ease-out),
                background var(--dur-micro) var(--ease-out),
                padding var(--dur-micro) var(--ease-out);
  }
  .input:focus-within {
    background: #fff;
    border: 2px solid var(--brand-500);
    box-shadow: 0 0 0 3px var(--brand-50);
    padding: 0 13px;
  }
  .input input {
    flex: 1; min-width: 0; height: 100%;
    border: 0; outline: 0; background: transparent;
    font-size: 14px; color: var(--neutral-900);
  }
  .input .leading { color: var(--neutral-400); }
  .input-action {
    background: transparent; border: 0; padding: 4px;
    color: var(--neutral-500);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .input-action:hover { color: var(--neutral-700); }

  /* strength bar */
  .strength {
    margin-top: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .strength-bars {
    flex: 1;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    height: 4px;
  }
  .strength-bars span {
    height: 100%; border-radius: 4px;
    background: var(--neutral-200);
  }
  .strength.s3 .strength-bars span:nth-child(-n+3) { background: var(--brand-500); }
  .strength-label {
    font-size: 11px; font-weight: 600;
    color: var(--brand-500);
  }

  .btn-primary {
    margin-top: 14px;
    width: 100%; height: 48px;
    background: var(--brand-600);
    color: #fff;
    border: 0; border-radius: 8px;
    font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 18px hsla(248, 60%, 47%, 0.28), 0 1px 2px rgba(30,20,60,0.06);
  }
  .btn-primary:hover { background: var(--brand-700); }
  .btn-secondary {
    margin-top: 32px;
    width: 100%; height: 48px;
    background: var(--neutral-100);
    color: var(--neutral-900);
    border: 1px solid var(--neutral-300);
    border-radius: 8px;
    font-size: 15px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
  }
  .btn-secondary:hover { background: var(--neutral-200); }

  .back-link {
    margin-top: 20px;
    text-align: center;
  }
  .back-link a {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; color: var(--neutral-600);
    text-decoration: none;
  }
  .back-link a:hover { color: var(--neutral-900); }
  .back-link .ico { color: var(--neutral-400); }

  .resend {
    margin-top: 16px;
    text-align: center;
  }
  .resend button {
    background: transparent; border: 0;
    color: var(--brand-600);
    font-size: 13px; font-weight: 400;
  }
  .resend button:hover { color: var(--brand-700); }

  .below {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--neutral-500);
  }
  .below a, .below button {
    color: var(--brand-600);
    text-decoration: none;
    background: transparent; border: 0;
    font-size: 13px;
    margin-left: 4px;
  }

  .email-display {
    margin: 8px 0 0 0;
    text-align: center;
    font-size: 14px; font-weight: 600;
    color: var(--neutral-900);
    word-break: break-all;
  }
</style>
</head>
<body data-screen-label="Forgot password">

<header class="topbar">
  <div class="topbar-inner">
    <a href="Landing Page.html" class="logo">
      <span class="logo-mark"><span></span><span></span><span></span><span></span></span>
      <span class="logo-word">Setlarr</span>
    </a>
  </div>
</header>

<main>
  <div class="frame">

    <!-- STATE 1 -->
    <div class="step-col">
      <span class="step-label"><span class="num">1</span> Request reset</span>
      <div class="card">
        <div class="icon-block brand"><i data-lucide="mail" style="width:24px;height:24px;"></i></div>
        <h1>Forgot your password?</h1>
        <p class="sub">Enter your email and we'll send a reset link.</p>
        <form onsubmit="event.preventDefault();">
          <div class="field">
            <label class="field-label" for="fp-email">Email address</label>
            <div class="input">
              <span class="leading"><i data-lucide="mail" style="width:16px;height:16px;"></i></span>
              <input id="fp-email" type="email" value="adaeze@gmail.com" />
            </div>
          </div>
          <button class="btn-primary" type="submit">
            <i data-lucide="send" style="width:16px;height:16px;"></i>
            Send reset link
          </button>
        </form>
        <div class="back-link">
          <a href="Sign In Page.html"><span class="ico"><i data-lucide="arrow-left" style="width:14px;height:14px;"></i></span>Back to sign in</a>
        </div>
      </div>
    </div>

    <!-- STATE 2 -->
    <div class="step-col">
      <span class="step-label"><span class="num">2</span> Check email</span>
      <div class="card">
        <div class="icon-block success"><i data-lucide="mail-check" style="width:24px;height:24px;"></i></div>
        <h1>Check your email</h1>
        <p class="sub">We sent a reset link to</p>
        <p class="email-display">adaeze@gmail.com</p>
        <button class="btn-secondary" type="button">
          <i data-lucide="external-link" style="width:16px;height:16px;"></i>
          Open email app
        </button>
        <div class="resend">
          <button type="button">Resend email</button>
        </div>
        <p class="below">Wrong email?<button type="button">Change it</button></p>
      </div>
    </div>

    <!-- STATE 3 -->
    <div class="step-col">
      <span class="step-label"><span class="num">3</span> Set new password</span>
      <div class="card">
        <div class="icon-block neutral"><i data-lucide="lock" style="width:24px;height:24px;"></i></div>
        <h1>Set new password</h1>
        <p class="sub">Must be at least 8 characters.</p>
        <form onsubmit="event.preventDefault();">
          <div class="field">
            <label class="field-label" for="np1">New password</label>
            <div class="input">
              <span class="leading"><i data-lucide="lock" style="width:16px;height:16px;"></i></span>
              <input id="np1" type="password" value="strong-pass" placeholder="At least 8 characters" />
              <button type="button" class="input-action" aria-label="Show password"><i data-lucide="eye" style="width:18px;height:18px;"></i></button>
            </div>
            <div class="strength s3">
              <div class="strength-bars"><span></span><span></span><span></span><span></span></div>
              <span class="strength-label">Strong</span>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="np2">Confirm password</label>
            <div class="input">
              <span class="leading"><i data-lucide="lock" style="width:16px;height:16px;"></i></span>
              <input id="np2" type="password" placeholder="Re-enter password" />
              <button type="button" class="input-action" aria-label="Show password"><i data-lucide="eye" style="width:18px;height:18px;"></i></button>
            </div>
          </div>
          <button class="btn-primary" type="submit">
            <i data-lucide="check" style="width:16px;height:16px;"></i>
            Update password
          </button>
        </form>
      </div>
    </div>

  </div>
</main>

<script>
  if (window.lucide && typeof lucide.createIcons === 'function') {
    lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
  }
</script>

</body>
</html>
