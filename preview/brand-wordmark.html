<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-surface); display:flex; align-items:center; gap:32px;}
  .mark {
    font-family: var(--font-sans);
    font-size:36px; font-weight:600; letter-spacing:-0.04em;
    color: var(--neutral-900);
    display:flex; align-items:center; gap:8px;
  }
  .mark .dot {
    width:10px; height:10px; border-radius:9999px; background: var(--brand-600);
    display:inline-block; margin-bottom:6px;
  }
  .inv { background: var(--neutral-900); color:#fff; padding:18px 24px; border-radius:10px; }
  .inv .mark { color:#fff; }
  .lockup { display:flex; flex-direction:column; align-items:center; gap:6px;}
  .legend { font-size:10px; font-weight:600; color:var(--neutral-500); letter-spacing:0.04em; text-transform:uppercase;}
  .note { font-size:11px; color: var(--neutral-500); max-width:200px; line-height:1.4;}
</style></head>
<body>
  <div class="lockup">
    <div class="mark">setlarr<span class="dot"></span></div>
    <div class="legend">Primary · light</div>
  </div>
  <div class="lockup">
    <div class="inv"><div class="mark">setlarr<span class="dot"></span></div></div>
    <div class="legend">Inverse · dark</div>
  </div>
  <div class="note">Wordmark synthesised from the system's own type + brand colour. Replace with the real mark when supplied.</div>
</body></html>
