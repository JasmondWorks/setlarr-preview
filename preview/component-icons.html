<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); display:flex; flex-direction:column; gap:14px;}
  .row { display:flex; align-items:center; gap:14px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .ico { stroke: var(--neutral-700); stroke-width:1.5; fill:none; }
  .lbl { font-size:10px; color:var(--neutral-500); font-variant-numeric:tabular-nums; }
  .head { font-size:10px; font-weight:600; color:var(--neutral-700); letter-spacing:0.04em; text-transform:uppercase; width:88px; }
  .demo { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--neutral-900); }
  .demo svg { stroke: var(--neutral-500); stroke-width:1.5; fill:none; }
</style></head>
<body>
  <div class="row">
    <div class="head">Sizes</div>
    <div class="item"><svg class="ico" width="14" height="14" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="lbl">14</div></div>
    <div class="item"><svg class="ico" width="16" height="16" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="lbl">16</div></div>
    <div class="item"><svg class="ico" width="20" height="20" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="lbl">20</div></div>
    <div class="item"><svg class="ico" width="24" height="24" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="lbl">24</div></div>
    <div class="item"><svg class="ico" width="48" height="48" viewBox="0 0 24 24" style="stroke:var(--neutral-300)"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><div class="lbl">48 · empty</div></div>
  </div>
  <div class="row">
    <div class="head">Pair</div>
    <div class="demo">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Lagos · Ikeja</span>
    </div>
    <div class="demo">
      <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>2 hours ago</span>
    </div>
    <div class="demo">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Verified seller</span>
    </div>
  </div>
</body></html>
