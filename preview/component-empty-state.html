<!doctype html>
<html><head><meta charset="utf-8"><title>Empty state</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-surface); display:flex; align-items:center; justify-content:center; min-height:240px;}
  .empty { display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; max-width:280px;}
  .empty svg { width:48px; height:48px; stroke: var(--neutral-300); stroke-width:1.5; fill:none; }
  .h { font-size:18px; font-weight:600; color: var(--neutral-900); }
  .b { font-size:14px; color: var(--neutral-500); line-height:1.55; }
  .btn { margin-top:8px; height:44px; padding:0 20px; border-radius:6px; background: var(--brand-600); color:#fff; font-size:14px; font-weight:600; border:0; }
</style></head>
<body>
  <div class="empty">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 14h2"/></svg>
    <div class="h">No money in escrow yet</div>
    <div class="b">Once a buyer locks payment for one of your items, it'll show up here.</div>
    <button class="btn">List your first item</button>
  </div>
</body></html>
