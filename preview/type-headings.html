<!doctype html>
<html><head><meta charset="utf-8"><title>Display + headings</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); display:flex; flex-direction:column; gap:14px; }
  .row { display:grid; grid-template-columns: 90px 1fr; align-items:baseline; gap:16px; }
  .meta { font-size:10px; color:var(--neutral-500); font-variant-numeric:tabular-nums; }
  .meta b { display:block; color:var(--neutral-700); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; font-size:10px; margin-bottom:2px;}
</style></head>
<body>
  <div class="row"><div class="meta"><b>Display</b>28 / 600</div><div class="t-display">Lock ₦434,700 in escrow</div></div>
  <div class="row"><div class="meta"><b>Heading 1</b>22 / 600</div><div class="t-h1">Your wallet</div></div>
  <div class="row"><div class="meta"><b>Heading 2</b>18 / 600</div><div class="t-h2">In escrow this week</div></div>
  <div class="row"><div class="meta"><b>Heading 3</b>15 / 600</div><div class="t-h3">Payment method</div></div>
</body></html>
