<!doctype html>
<html><head><meta charset="utf-8"><title>Brand scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); }
  .row { display:flex; gap:8px; }
  .swatch { flex:1; height:88px; border-radius:8px; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; color:#fff; }
  .swatch.light { color: var(--brand-900); }
  .swatch .name { font-size:11px; font-weight:600; letter-spacing:0.02em; }
  .swatch .val  { font-size:10px; opacity:0.7; font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="row">
    <div class="swatch light" style="background:var(--brand-50)"><div class="name">50</div><div class="val">248·80·96</div></div>
    <div class="swatch light" style="background:var(--brand-100)"><div class="name">100</div><div class="val">248·75·91</div></div>
    <div class="swatch" style="background:var(--brand-500)"><div class="name">500</div><div class="val">248·62·55</div></div>
    <div class="swatch" style="background:var(--brand-600)"><div class="name">600 · primary</div><div class="val">248·60·47</div></div>
    <div class="swatch" style="background:var(--brand-700)"><div class="name">700 · hover</div><div class="val">248·60·39</div></div>
    <div class="swatch" style="background:var(--brand-900)"><div class="name">900</div><div class="val">248·62·18</div></div>
  </div>
</body></html>
