<!doctype html>
<html><head><meta charset="utf-8"><title>Body + supporting type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); display:flex; flex-direction:column; gap:12px; }
  .row { display:grid; grid-template-columns: 90px 1fr; align-items:baseline; gap:16px; }
  .meta { font-size:10px; color:var(--neutral-500); font-variant-numeric:tabular-nums; }
  .meta b { display:block; color:var(--neutral-700); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; font-size:10px; margin-bottom:2px;}
</style></head>
<body>
  <div class="row"><div class="meta"><b>Body LG</b>16 / 400</div><div class="t-body-lg">Funds are held until the buyer confirms delivery.</div></div>
  <div class="row"><div class="meta"><b>Body</b>14 / 400</div><div class="t-body">Standard reading size for forms and prose across the app.</div></div>
  <div class="row"><div class="meta"><b>Label</b>12 / 600</div><div class="t-label">Email address</div></div>
  <div class="row"><div class="meta"><b>Caption</b>12 / 400</div><div class="t-caption">2 hours ago · Lagos</div></div>
  <div class="row"><div class="meta"><b>Micro</b>11 / 400</div><div class="t-micro">Standard fees apply. See terms.</div></div>
</body></html>
