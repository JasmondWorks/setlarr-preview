<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--neutral-50); display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px;}
  .card { background:#fff; border-radius:10px; padding:16px; box-shadow: var(--elevation-2);}
  .flat { background: var(--neutral-50); border:1px solid var(--neutral-200); border-radius:10px; padding:16px; box-shadow: none;}
  .alert { background: var(--warning-50); border-left:3px solid var(--warning-600); border-radius:10px; padding:14px 16px;}
  .meta { font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--neutral-500); margin-bottom:6px;}
  .h { font-size:14px; font-weight:600; color:var(--neutral-900); margin-bottom:4px;}
  .b { font-size:12px; color:var(--neutral-600); line-height:1.5;}
  .alert .h { color:var(--warning-900); }
  .alert .b { color:var(--warning-900); }
</style></head>
<body>
  <div class="card">
    <div class="meta">Standard · shadow</div>
    <div class="h">₦434,700 in escrow</div>
    <div class="b">Releases to seller when you confirm delivery.</div>
  </div>
  <div class="flat">
    <div class="meta">Flat · bordered</div>
    <div class="h">For surfaces on white</div>
    <div class="b">Used when a shadow can't read against an already-white page.</div>
  </div>
  <div class="alert">
    <div class="meta" style="color:var(--warning-600)">Alert · left accent</div>
    <div class="h">Awaiting shipment</div>
    <div class="b">Seller has 36 hours to ship before the order auto-cancels.</div>
  </div>
</body></html>
