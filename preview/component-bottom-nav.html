<!doctype html>
<html><head><meta charset="utf-8"><title>Bottom nav + FAB</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--neutral-50);}
  .stage { width:380px; margin:0 auto; position:relative; }
  .nav {
    height:64px; background:#fff; border-top:1px solid var(--neutral-200);
    border-radius:10px;
    display:grid; grid-template-columns: repeat(5, 1fr);
  }
  .tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; position:relative; padding-top:8px;}
  .tab svg { width:20px; height:20px; stroke-width:1.5; fill:none; stroke: var(--neutral-400);}
  .tab .lbl { font-size:10px; color: var(--neutral-400); font-weight:400;}
  .tab.active svg { stroke: var(--neutral-900); }
  .tab.active .lbl { color: var(--neutral-900); font-weight: 600; }
  .tab.active::before {
    content:""; position:absolute; top:0; left:50%; transform: translateX(-50%);
    width:16px; height:4px; background: var(--brand-600); border-radius:0 0 9999px 9999px;
  }
  .badge {
    position:absolute; top:6px; right:calc(50% - 18px);
    width:8px; height:8px; background: var(--danger-500); border-radius:9999px;
    box-shadow: 0 0 0 1.5px #fff;
  }
  .fab-slot { position:relative; }
  .fab {
    position:absolute; top:-8px; left:50%; transform: translateX(-50%);
    width:44px; height:44px; background: var(--brand-600); color:#fff;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--elevation-2);
  }
  .fab svg { width:20px; height:20px; stroke-width:1.5; fill:none; stroke: currentColor; }
  .fab-lbl { font-size:10px; font-weight:600; color: var(--neutral-700); position:absolute; bottom:10px; left:50%; transform:translateX(-50%); white-space:nowrap;}
</style></head>
<body>
  <div class="stage">
    <div class="nav">
      <div class="tab active">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
        <div class="lbl">Home</div>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <div class="lbl">Search</div>
      </div>
      <div class="tab fab-slot">
        <div class="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="fab-lbl">Sell</div>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        <div class="lbl">Chats</div>
        <div class="badge"></div>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <div class="lbl">You</div>
      </div>
    </div>
  </div>
</body></html>
