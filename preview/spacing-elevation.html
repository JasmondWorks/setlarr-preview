<!doctype html>
<html><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:32px 24px; background: var(--neutral-50); display:flex; gap:20px; align-items:center; justify-content:space-around; }
  .item { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box { width:120px; height:74px; background:#fff; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--neutral-500); }
  .name { font-size:10px; font-weight:600; letter-spacing:0.04em; color:var(--neutral-700); text-transform:uppercase; }
  .use  { font-size:10px; color:var(--neutral-500); }
</style></head>
<body>
  <div class="item">
    <div class="box" style="border:1px dashed var(--neutral-300); color:var(--neutral-400)">flat</div>
    <div class="name">Elevation 0</div><div class="use">page level</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:var(--elevation-1)">input · subtle card</div>
    <div class="name">Elevation 1</div><div class="use">resting input</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:var(--elevation-2)">standard card</div>
    <div class="name">Elevation 2</div><div class="use">cards, dropdowns</div>
  </div>
  <div class="item">
    <div class="box" style="box-shadow:var(--elevation-3)">modal · sheet</div>
    <div class="name">Elevation 3</div><div class="use">modals, sheets</div>
  </div>
</body></html>
