<!doctype html>
<html><head><meta charset="utf-8"><title>Neutral scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); }
  .row { display:flex; gap:8px; }
  .swatch { flex:1; height:88px; border-radius:8px; display:flex; flex-direction:column; justify-content:flex-end; padding:8px 10px; }
  .swatch .name { font-size:11px; font-weight:600; letter-spacing:0.02em; }
  .swatch .val  { font-size:10px; opacity:0.65; font-variant-numeric: tabular-nums; }
  .dark .name, .dark .val { color: #fff; }
  .light .name, .light .val { color: var(--neutral-900); }
</style></head>
<body>
  <div class="row">
    <div class="swatch light" style="background:var(--neutral-50)"><div class="name">50</div><div class="val">240·20·98</div></div>
    <div class="swatch light" style="background:var(--neutral-100)"><div class="name">100</div><div class="val">240·16·95</div></div>
    <div class="swatch light" style="background:var(--neutral-200)"><div class="name">200</div><div class="val">240·12·90</div></div>
    <div class="swatch light" style="background:var(--neutral-300)"><div class="name">300</div><div class="val">240·10·82</div></div>
    <div class="swatch light" style="background:var(--neutral-400)"><div class="name">400</div><div class="val">240·8·65</div></div>
    <div class="swatch dark" style="background:var(--neutral-500)"><div class="name">500</div><div class="val">240·8·50</div></div>
    <div class="swatch dark" style="background:var(--neutral-600)"><div class="name">600</div><div class="val">240·8·38</div></div>
    <div class="swatch dark" style="background:var(--neutral-700)"><div class="name">700</div><div class="val">240·8·26</div></div>
    <div class="swatch dark" style="background:var(--neutral-900)"><div class="name">900</div><div class="val">240·12·12</div></div>
  </div>
</body></html>
