<!doctype html>
<html><head><meta charset="utf-8"><title>Semantic scales</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:18px 24px; background: var(--bg-surface); display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:6px; align-items:center; }
  .row .label { width:78px; font-size:11px; font-weight:600; color: var(--neutral-700); letter-spacing:0.04em; text-transform:uppercase;}
  .sw { flex:1; height:46px; border-radius:6px; display:flex; align-items:flex-end; padding:6px 8px; }
  .sw .n { font-size:10px; font-weight:600; opacity:0.85; }
  .sw.lt .n { color: var(--neutral-900); }
  .sw.dk .n { color: #fff; }
</style></head>
<body>
  <div class="row">
    <div class="label">Success</div>
    <div class="sw lt" style="background:var(--success-50)"><div class="n">50</div></div>
    <div class="sw dk" style="background:var(--success-500)"><div class="n">500</div></div>
    <div class="sw dk" style="background:var(--success-600)"><div class="n">600</div></div>
    <div class="sw dk" style="background:var(--success-900)"><div class="n">900</div></div>
  </div>
  <div class="row">
    <div class="label">Warning</div>
    <div class="sw lt" style="background:var(--warning-50)"><div class="n">50</div></div>
    <div class="sw dk" style="background:var(--warning-500)"><div class="n">500</div></div>
    <div class="sw dk" style="background:var(--warning-600)"><div class="n">600</div></div>
    <div class="sw dk" style="background:var(--warning-900)"><div class="n">900</div></div>
  </div>
  <div class="row">
    <div class="label">Danger</div>
    <div class="sw lt" style="background:var(--danger-50)"><div class="n">50</div></div>
    <div class="sw dk" style="background:var(--danger-500)"><div class="n">500</div></div>
    <div class="sw dk" style="background:var(--danger-600)"><div class="n">600</div></div>
    <div class="sw dk" style="background:var(--danger-900)"><div class="n">900</div></div>
  </div>
</body></html>
