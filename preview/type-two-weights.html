<!doctype html>
<html><head><meta charset="utf-8"><title>Two weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-surface); display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:6px; }
  .big { font-size:54px; line-height:1; color:var(--neutral-900); }
  .name { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--neutral-500); }
  .use  { font-size:12px; color:var(--neutral-600); }
</style></head>
<body>
  <div class="col">
    <div class="big" style="font-weight:400">Aa</div>
    <div class="name">Regular · 400</div>
    <div class="use">Body, captions, hints, metadata — everything that isn't a heading or a price.</div>
  </div>
  <div class="col">
    <div class="big" style="font-weight:600">Aa</div>
    <div class="name">Semibold · 600</div>
    <div class="use">Headings, prices, primary labels, CTAs. Never 500. Never 700. Never bold mid-sentence.</div>
  </div>
</body></html>
