<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px 24px; background: var(--bg-surface); display:flex; flex-direction:column; gap:8px; }
  .row { display:grid; grid-template-columns: 64px 1fr 130px; align-items:center; gap:12px; }
  .name { font-size:11px; font-weight:600; color:var(--neutral-700); letter-spacing:0.04em; text-transform:uppercase; font-variant-numeric:tabular-nums; }
  .bar  { height:8px; background:var(--brand-500); border-radius:2px; }
  .use  { font-size:11px; color:var(--neutral-500); }
</style></head>
<body>
  <div class="row"><div class="name">1 · 4</div><div class="bar" style="width:4px"></div><div class="use">icon-to-label</div></div>
  <div class="row"><div class="name">2 · 8</div><div class="bar" style="width:8px"></div><div class="use">inline gaps</div></div>
  <div class="row"><div class="name">3 · 12</div><div class="bar" style="width:12px"></div><div class="use">form padding</div></div>
  <div class="row"><div class="name">4 · 16</div><div class="bar" style="width:16px"></div><div class="use">component padding</div></div>
  <div class="row"><div class="name">5 · 20</div><div class="bar" style="width:20px"></div><div class="use">loose elements</div></div>
  <div class="row"><div class="name">6 · 24</div><div class="bar" style="width:24px"></div><div class="use">screen gutter</div></div>
  <div class="row"><div class="name">8 · 32</div><div class="bar" style="width:32px"></div><div class="use">between groups</div></div>
  <div class="row"><div class="name">10 · 40</div><div class="bar" style="width:40px"></div><div class="use">major sections</div></div>
  <div class="row"><div class="name">12 · 48</div><div class="bar" style="width:48px"></div><div class="use">hero breathing</div></div>
  <div class="row"><div class="name">16 · 64</div><div class="bar" style="width:64px"></div><div class="use">empty-state pad</div></div>
</body></html>
