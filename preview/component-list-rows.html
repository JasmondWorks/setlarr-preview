<!doctype html>
<html><head><meta charset="utf-8"><title>List rows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:16px 24px; background: var(--bg-surface);}
  .list { display:flex; flex-direction:column; }
  .row { display:flex; align-items:center; gap:12px; min-height:56px; padding:12px 0; border-bottom:1px solid var(--neutral-200); }
  .row:last-child { border-bottom: 0; }
  .row.selected { background: var(--brand-50); border-left:3px solid var(--brand-600); padding-left:12px; margin-left:-12px;}
  .icon-sq { width:32px; height:32px; border-radius:6px; background:var(--neutral-100); display:flex; align-items:center; justify-content:center; color:var(--neutral-500); flex-shrink:0;}
  .icon-sq svg { width:18px; height:18px; }
  .text { flex:1; display:flex; flex-direction:column; gap:2px;}
  .title { font-size:14px; font-weight:600; color:var(--neutral-900);}
  .sub  { font-size:12px; color:var(--neutral-500);}
  .right { font-size:12px; color:var(--neutral-500); font-variant-numeric:tabular-nums;}
</style></head>
<body>
  <div class="list">
    <div class="row">
      <div class="icon-sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div>
      <div class="text"><div class="title">Payment methods</div><div class="sub">2 cards · GTBank, Access</div></div>
      <div class="right">›</div>
    </div>
    <div class="row selected">
      <div class="icon-sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
      <div class="text"><div class="title">Identity &amp; verification</div><div class="sub">Verified · Adaeze Okafor</div></div>
      <div class="right">›</div>
    </div>
    <div class="row">
      <div class="icon-sq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg></div>
      <div class="text"><div class="title">Notifications</div><div class="sub">Push + email</div></div>
      <div class="right">›</div>
    </div>
  </div>
</body></html>
